name: objectscript-quality
on: push

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ObjectScript Quality
        run: pip install objectscript-quality
      - name: Run objectscript-quality
        run: |
          osc -n -ir -p src --std=isc
        continue-on-error: true
