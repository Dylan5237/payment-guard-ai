# CSP config file (based on the image default) + PaymentGuard app paths

LoadModule rewrite_module /usr/lib/apache2/modules/mod_rewrite.so

CSPModulePath "${ISC_PACKAGE_INSTALLDIR}/bin/"
CSPConfigPath "${ISC_PACKAGE_INSTALLDIR}/bin/"

<Location "/csp/bin/Systems/">
    SetHandler csp-handler-sa
</Location>
<Location "/csp/bin/RunTime/">
    SetHandler csp-handler-sa
</Location>

# IRIS web applications served through the gateway (by file extension).
# This CSP module build only intercepts listed extensions, so the pretty,
# extensionless REST URLs are internally rewritten to carry a .csp suffix
# (see RewriteRule below); the REST dispatch class maps both forms.
<Location "/csp">
    CSPFileTypes csp cls zen cxw
</Location>
<Location "/paymentguard/api">
    CSPFileTypes csp cls
    RewriteEngine On
    RewriteRule "^(.*/[^/.]+)$" "$1.csp" [PT]
</Location>

<Directory "${ISC_PACKAGE_INSTALLDIR}/bin/">
    AllowOverride None
    Options None
    Require all granted
    <FilesMatch "\.(log|ini|pid|exe)$">
         Require all denied
    </FilesMatch>
</Directory>
