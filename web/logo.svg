  <path d="M 256 106 L 378 147 V 269" fill="none" stroke="#7DD3FC" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>

  <!-- credit card -->
  <g transform="rotate(-8 256 278)">
    <rect x="176" y="228" width="160" height="102" rx="14" fill="#F2F6FB"/>
    <rect x="176" y="252" width="160" height="20" fill="#101A2E"/>
    <rect x="190" y="290" width="30" height="21" rx="4" fill="#FFD54A"/>
    <rect x="232" y="298" width="86" height="6" rx="3" fill="#9FB2CC"/>
    <rect x="232" y="308" width="60" height="6" rx="3" fill="#C3D1E4"/>
  </g>

  <!-- decision check -->
  <circle cx="340" cy="328" r="34" fill="#34D399" stroke="#0A101E" stroke-width="7"/>
  <path d="M 322 328 L 333 339 L 359 315" fill="none" stroke="#062818" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AI spark -->
  <path d="M 388 100 L 397 121 L 418 130 L 397 139 L 388 160 L 379 139 L 358 130 L 379 121 Z"
        fill="#FFD54A" stroke="#0A101E" stroke-width="4" stroke-linejoin="round"/>

  <!-- signal dots -->
