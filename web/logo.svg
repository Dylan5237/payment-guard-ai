<svg xmlns="http://www.w3.org/2000/svg" width="321" height="364" viewBox="106 78 321 364">
  <defs>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- shield -->
  <path d="M 256 92 L 392 138 V 270 C 392 348 332 402 256 428 C 180 402 120 348 120 270 V 138 Z"
